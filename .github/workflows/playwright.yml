name: Playwright tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options:
          - smoke
          - all
        default: smoke

jobs:
  tests:
    name: tests (${{ inputs.suite || 'smoke' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Push events have no inputs, so they fall back to the smoke suite.
      SUITE: ${{ inputs.suite || 'smoke' }}
      STOCKLY_PASSWORD: ${{ secrets.STOCKLY_PASSWORD }}
      # Fallback keeps the default URL if the repository variable is not set
      # (an empty BASE_URL would otherwise override the default in playwright.config.ts).
      BASE_URL: ${{ vars.BASE_URL || 'https://stockly-azure-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run ${{ env.SUITE }} tests
        run: |
          if [ "$SUITE" = "all" ]; then
            npm test
          else
            npm run test:smoke
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ env.SUITE }}
          path: playwright-report/
          retention-days: 14
