name: Playwright smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STOCKLY_PASSWORD: ${{ secrets.STOCKLY_PASSWORD }}
      # Fallback keeps the default URL if the repository variable is not set
      # (an empty BASE_URL would otherwise override the default in playwright.config.ts).
      BASE_URL: ${{ vars.BASE_URL || 'https://stockly-azure-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
